<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唐风 · 宋韵 | 八大古法妆容复原图集</title>
<style>
  :root{
    --w: 680px; --h: 960px;
    --gold: #c9a35a;
    --paper: #f4ecd8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#12182a;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .kai{ font-family:"STKaiti","KaiTi","Kaiti SC","Noto Serif SC",serif; }

  /* ---------- 舞台背景 ---------- */
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1100px 700px at 50% -10%, #2c3a5e 0%, transparent 60%),
      radial-gradient(900px 600px at 85% 110%, #1d2540 0%, transparent 55%),
      linear-gradient(165deg,#1a2237,#12182a 60%,#0e1424);
  }
  /* 金色细线画框 */
  .frame{ position:fixed; inset:14px; border:1px solid rgba(201,163,90,.22); pointer-events:none; z-index:5; }
  .frame::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(201,163,90,.10); }
  .frame i{ position:absolute; width:14px; height:14px; border:1px solid rgba(201,163,90,.55); }
  .frame i:nth-child(1){ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame i:nth-child(2){ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .frame i:nth-child(3){ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .frame i:nth-child(4){ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  /* ---------- 书本 ---------- */
  #bookWrap{ position:relative; width:var(--w); height:var(--h);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .floor{ position:absolute; left:6%; right:6%; bottom:-80px; height:130px; z-index:0;
    background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.55), transparent 70%); filter:blur(10px); }
  .stack{ position:absolute; inset:0; z-index:1; }
  .stack::before{ content:""; position:absolute; inset:5px -6px -6px 5px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); }
  .stack::after{ content:""; position:absolute; inset:10px -11px -11px 10px;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }

  #book{ position:absolute; inset:0; z-index:2; perspective:2400px;
    animation:bookIn 1.25s cubic-bezier(.16,.7,.2,1) both .3s; }
  @keyframes bookIn{
    0%{ opacity:0; transform:translateY(85px) scale(.9); filter:blur(10px); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  #bookWrap.nudge{ animation:nudge .35s ease; }
  @keyframes nudge{ 25%{ translate:10px 0; } 75%{ translate:-10px 0; } }

  .page{ position:absolute; inset:0; transform-style:preserve-3d; transform-origin:left center;
    transition:transform .42s cubic-bezier(.35,.08,.25,1); }
  .page.flipped{ transform:rotateY(-180deg); }
  .page.settled{ opacity:0; pointer-events:none;
    transition:transform .42s cubic-bezier(.35,.08,.25,1), opacity .3s ease .22s; }
  .page.no-trans{ transition:none; }
  .page.flipping .face{ box-shadow:0 22px 60px rgba(0,0,0,.5); }

  .face{ position:absolute; inset:0; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .front{ background:var(--paper); }
  .front::before{ content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(90deg, rgba(60,40,10,.10), transparent 7%); }
  .front img{ position:absolute; inset:26px; width:calc(100% - 52px); height:calc(100% - 52px);
    object-fit:contain; opacity:0; transition:opacity .5s; pointer-events:none; }
  .front.ok img{ opacity:1; }
  .front .spin{ position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%; border:2px solid rgba(160,130,70,.25); border-top-color:var(--gold);
    animation:rot 1s linear infinite; opacity:0; }
  .front:not(.ok):not(.err) .spin{ opacity:1; }
  .front.err::after{ content:"图片加载失败"; position:absolute; inset:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    color:#b09966; font-size:14px; letter-spacing:2px; }
  @keyframes rot{ to{ transform:rotate(360deg); } }

  /* 页背面（纸张质感 + 暗纹印章） */
  .back{ transform:rotateY(180deg);
    background:
      linear-gradient(-90deg, rgba(70,50,20,.18), transparent 10%),
      linear-gradient(90deg, rgba(70,50,20,.10), transparent 8%),
      radial-gradient(120% 90% at 50% 50%, #f3ead4, #e9dec2); }
  .back::after{ content:"唐风 · 宋韵"; position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); writing-mode:vertical-rl;
    letter-spacing:14px; font-size:20px; color:rgba(150,115,55,.22); }

  /* 精装页（封面 / 封底） */
  .page.hard .face{ box-shadow:inset 0 0 0 1px rgba(120,90,40,.35), 0 12px 34px rgba(0,0,0,.38); }
  .page.hard .front{ background:#efe4c8; }
  .page.hard .front img{ inset:0; width:100%; height:100%; object-fit:contain; }
  .page.hard .front::after{ content:""; position:absolute; inset:9px; z-index:2; pointer-events:none;
    border:1px solid rgba(90,65,25,.30); }

  /* 封面流光扫过（GPU 合成动画，播 3 轮后停止，翻开一次即隐藏） */
  .sheen{ position:absolute; inset:0; z-index:3; overflow:hidden; pointer-events:none; }
  .sheen::before{ content:""; position:absolute; top:-20%; bottom:-20%; width:38%; left:-60%;
    background:linear-gradient(105deg, transparent 0%, rgba(255,242,205,.28) 45%, rgba(255,246,220,.5) 50%, rgba(255,242,205,.28) 55%, transparent 100%);
    transform:skewX(-8deg) translateX(-160%);
    animation:sweep 3.4s ease-in-out 3; will-change:transform; }
  @keyframes sweep{
    0%{ transform:skewX(-8deg) translateX(-160%); }
    55%{ transform:skewX(-8deg) translateX(320%); }
    100%{ transform:skewX(-8deg) translateX(320%); }
  }
  body.opened .sheen{ display:none; }

  /* ---------- 手机竖屏全屏模式：书页铺满屏幕 ---------- */
  body.fs #bookWrap{ width:100vw; height:calc(100vh - 72px); }
  body.fs .stack, body.fs .floor, body.fs .frame, body.fs .toptitle{ display:none; }
  body.fs .front img{ inset:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
  body.fs .hint{ top:14px; bottom:auto; }
  body.fs .page.flipping .face{ box-shadow:0 18px 44px rgba(0,0,0,.42); }

  /* 封底结束页 */
  .page.end .front{ background:radial-gradient(120% 90% at 50% 15%, #33406b, #1c2542 55%, #151c33);
    display:flex; align-items:center; justify-content:center; }
  .endin{ text-align:center; border:1px solid rgba(201,163,90,.4); padding:46px 60px; position:relative; }
  .endin::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(201,163,90,.18); }
  .et{ font-size:96px; color:var(--gold); line-height:1; text-shadow:0 4px 24px rgba(0,0,0,.45); }
  .es{ margin-top:18px; color:rgba(238,224,190,.85); letter-spacing:10px; font-size:16px; }
  .ee{ margin-top:14px; color:rgba(238,224,190,.35); font-size:9px; letter-spacing:2px; }

  /* ---- 结尾特效：落章 + 光晕 + 文字浮现 ---- */
  .page.end .endin{ opacity:0; }
  .page.end.show .endin{ animation:endIn .7s ease both; }
  @keyframes endIn{ from{ opacity:0; transform:scale(.94) translateY(8px); } to{ opacity:1; transform:none; } }
  .page.end.show .et{ animation:stamp .75s cubic-bezier(.2,1.5,.35,1) both .35s; }
  @keyframes stamp{
    0%{ opacity:0; transform:scale(2.4); filter:blur(6px); }
    65%{ opacity:1; transform:scale(.93); filter:blur(0); }
    100%{ transform:scale(1); }
  }
  .page.end.show .es{ animation:fadeUp2 .8s ease both 1s; }
  .page.end.show .ee{ animation:fadeUp2 .8s ease both 1.15s; }
  @keyframes fadeUp2{ from{ opacity:0; translate:0 10px; } to{ opacity:1; translate:0 0; } }
  .page.end .endin::after{ content:""; position:absolute; inset:-45%; z-index:-1; opacity:0;
    background:radial-gradient(circle, rgba(201,163,90,.32), transparent 62%); }
  .page.end.show .endin::after{ animation:bloom 1.5s ease-out both .25s; }
  @keyframes bloom{ 0%{ opacity:0; transform:scale(.35); } 45%{ opacity:1; } 100%{ opacity:0; transform:scale(1.7); } }

  /* ---- 漫天浮金（开场氛围） ---- */
  .dust{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .dust i{ position:absolute; bottom:-24px; border-radius:50%;
    background:radial-gradient(circle, rgba(236,210,150,.95), rgba(236,210,150,0) 70%);
    animation:rise linear infinite; }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    12%{ opacity:.85; }
    85%{ opacity:.45; }
    100%{ transform:translateY(-106vh) translateX(24px); opacity:0; }
  }

  /* ---- 金瓣飘落（结尾氛围） ---- */
  #petals{ position:fixed; inset:0; z-index:9; pointer-events:none; overflow:hidden; display:none; }
  #petals.on{ display:block; }
  #petals i{ position:absolute; top:-5vh; border-radius:50% 50% 50% 0;
    background:linear-gradient(135deg,#ecd193,#b98e3e);
    box-shadow:0 0 6px rgba(233,200,130,.45);
    animation:fall linear infinite; }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.9; }
    90%{ opacity:.7; }
    100%{ transform:translateY(110vh) translateX(var(--sway)) rotate(560deg); opacity:0; }
  }

  /* ---------- 顶部标题 / 底部控制 ---------- */
  .toptitle{ position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:29;
    text-align:center; pointer-events:none;
    opacity:0; translate:0 -10px; transition:opacity .9s ease .35s, translate .9s ease .35s; }
  .toptitle.in{ opacity:1; translate:0 0; }
  .toptitle .t1{ font-size:15px; letter-spacing:8px; color:rgba(232,215,175,.9); }
  .toptitle .t2{ margin-top:5px; font-size:9px; letter-spacing:4px; color:rgba(232,215,175,.45); }

  .hint{ position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:29;
    color:rgba(235,220,185,.85); font-size:12px; letter-spacing:4px;
    animation:float 2.2s ease-in-out infinite; transition:opacity .6s; pointer-events:none; }
  @keyframes float{ 50%{ translate:0 -6px; } }

  .bar{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:14px;
    background:rgba(16,22,38,.66); backdrop-filter:blur(10px);
    border:1px solid rgba(201,163,90,.25); border-radius:999px; padding:8px 18px; color:#e8dcc0;
    animation:barIn .9s ease both 1.05s; }
  @keyframes barIn{ from{ opacity:0; translate:0 16px; } to{ opacity:1; translate:0 0; } }
  .bar button{ width:36px; height:36px; border-radius:50%; cursor:pointer;
    border:1px solid rgba(201,163,90,.35); background:transparent; color:#e8dcc0;
    font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center;
    transition:background .25s, color .25s, border-color .25s; }
  .bar button:hover{ background:var(--gold); color:#1c1508; border-color:var(--gold); }
  #cnt{ min-width:64px; text-align:center; font-size:13px; letter-spacing:2px; color:#d9c9a3; }
  .prog{ position:fixed; left:0; bottom:0; height:2px; width:0; z-index:31;
    background:linear-gradient(90deg,#8a6a33,var(--gold)); transition:width .5s; }

  body.opened .hint, body.opened .toptitle{ opacity:0; }

  /* ---------- 加载页 ---------- */
  #loader{ position:fixed; inset:0; z-index:99;
    background:linear-gradient(165deg,#1a2237,#0e1424);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .7s; }
  #loader.off{ opacity:0; pointer-events:none; }
  #loader .seal{ width:64px; height:64px; border:1px solid rgba(201,163,90,.6);
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; font-size:22px; color:var(--gold); letter-spacing:4px;
    animation:sealIn .8s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes sealIn{ 0%{ opacity:0; transform:scale(1.9) rotate(-10deg); filter:blur(5px); }
    100%{ opacity:1; transform:scale(1) rotate(0); filter:blur(0); } }
  #loader .lt{ color:rgba(232,215,175,.85); letter-spacing:6px; font-size:14px; }
  #loader .lt span{ display:inline-block; opacity:0; animation:chIn .55s ease both; }
  @keyframes chIn{ from{ opacity:0; translate:0 8px; } to{ opacity:1; translate:0 0; } }
  #loader .lb{ width:140px; height:2px; background:rgba(255,255,255,.08); overflow:hidden; border-radius:2px; }
  #loader .lb i{ display:block; height:100%; width:40%; background:var(--gold);
    animation:load 1.2s ease-in-out infinite; }
  @keyframes load{ 0%{ translate:-110% 0; } 100%{ translate:280% 0; } }
</style>
</head>
<body>

<div id="loader">
  <div class="seal kai">唐宋</div>
  <div class="lt kai" id="ltTitle">唐风 · 宋韵</div>
  <div class="lb"><i></i></div>
</div>

<div class="dust" id="dust"></div>
<div id="petals"></div>

<div id="stage">
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div id="bookWrap">
    <div class="floor"></div>
    <div class="stack"></div>
    <div id="book"></div>
  </div>
</div>

<div class="toptitle">
  <div class="t1 kai">唐风 · 宋韵</div>
  <div class="t2">八大古法妆容复原图集</div>
</div>
<div class="hint">‹ &nbsp;滑动 / 点击翻页&nbsp; ›</div>

<div class="bar">
  <button id="prev" aria-label="上一页">‹</button>
  <span id="cnt">1 / 1</span>
  <button id="next" aria-label="下一页">›</button>
  <button id="restart" aria-label="重新翻阅" title="重新翻阅" style="display:none">⟲</button>
</div>
<div class="prog" id="prog"></div>

<script>
/* ============================================================
 *  图册配置：增删图片只改这里（第 1 张为封面，最后自动加封底）
 * ============================================================ */
const IMGS = [
  "images/cover.webp",
  "images/02.webp","images/03.webp","images/04.webp","images/05.webp","images/06.webp",
  "images/07.webp","images/08.webp","images/09.webp","images/10.webp",
  "images/11.webp","images/12.webp","images/13.webp","images/14.webp",
  "images/15.webp","images/16.webp","images/17.webp","images/18.webp",
  "images/19.webp","images/20.webp",
  "images/21.webp","images/22.webp","images/23.webp","images/24.webp",
  "images/25.webp","images/26.webp","images/27.webp","images/28.webp",
  "images/29.webp","images/30.webp","images/31.webp","images/32.webp",
  "images/33.webp","images/34.webp","images/35.webp"
];

/* ================= 以下为翻书引擎，无需改动 ================= */
const pages = [
  { src: IMGS[0], hard: true },
  ...IMGS.slice(1).map(s => ({ src: s })),
  { end: true, hard: true }
];
const N = pages.length;
const W = 680, H = 960;

const book = document.getElementById("book");
const wrap = document.getElementById("bookWrap");
const cnt = document.getElementById("cnt");
const prog = document.getElementById("prog");
const loader = document.getElementById("loader");
const restartBtn = document.getElementById("restart");
const petals = document.getElementById("petals");

/* ---- 开场氛围：标题逐字、浮金尘埃 ---- */
const lt = document.getElementById("ltTitle");
lt.innerHTML = [...lt.textContent].map((c, i) =>
  `<span style="animation-delay:${(0.25 + i * 0.09).toFixed(2)}s">${c === " " ? "&nbsp;" : c}</span>`).join("");
const dust = document.getElementById("dust");
for (let i = 0; i < 14; i++){
  const s = document.createElement("i");
  const sz = 2 + Math.random() * 3;
  s.style.cssText =
    `left:${(Math.random() * 100).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;` +
    `opacity:${(0.2 + Math.random() * 0.4).toFixed(2)};` +
    `animation-duration:${(9 + Math.random() * 10).toFixed(1)}s;` +
    `animation-delay:${(-Math.random() * 18).toFixed(1)}s;`;
  dust.appendChild(s);
}
/* ---- 结尾氛围：金瓣 ---- */
for (let i = 0; i < 16; i++){
  const p = document.createElement("i");
  p.style.cssText =
    `left:${(Math.random() * 100).toFixed(1)}%;` +
    `width:${(7 + Math.random() * 7).toFixed(0)}px;height:${(10 + Math.random() * 8).toFixed(0)}px;` +
    `--sway:${(Math.random() * 160 - 80).toFixed(0)}px;` +
    `animation-duration:${(4.5 + Math.random() * 3.5).toFixed(1)}s;` +
    `animation-delay:${(-Math.random() * 6).toFixed(1)}s;`;
  petals.appendChild(p);
}

const pageEls = [];
pages.forEach((p, i) => {
  const el = document.createElement("div");
  el.className = "page" + (p.hard ? " hard" : "") + (p.end ? " end" : "");
  el.style.zIndex = N - i;
  const front = p.end
    ? `<div class="endin"><div class="et kai">完</div><div class="es">感 谢 翻 阅</div><div class="ee">THE TANG-SONG MAKEUP AESTHETICS MANUAL</div></div>`
    : `<div class="spin"></div><img alt="" draggable="false">${i === 0 ? '<div class="sheen"></div>' : ''}`;
  el.innerHTML = `<div class="face front">${front}</div><div class="face back"></div>`;
  book.appendChild(el);
  pageEls.push(el);
});

/* ---- 图片按需加载（当前页 + 后 3 页预载） ---- */
const loaded = new Array(N).fill(false);
function ensure(...idxs){
  idxs.forEach(i => {
    if (i < 0 || i >= N || loaded[i] || !pages[i].src) return;
    loaded[i] = true;
    const img = pageEls[i].querySelector("img");
    const f = pageEls[i].querySelector(".front");
    img.onload = () => { f.classList.add("ok"); if (i === 0) hideLoader(); };
    img.onerror = () => f.classList.add("err");
    img.src = pages[i].src;
  });
}
let loaderHidden = false;
function hideLoader(){
  if (loaderHidden) return; loaderHidden = true;
  document.querySelector(".toptitle").classList.add("in");
  setTimeout(() => loader.classList.add("off"), 350);
}
setTimeout(hideLoader, 3500);

/* ---- 状态 ---- */
/* 页码标签：与图内印刷页码保持一致（cover=封面，末页=完） */
const labels = ["封面"];
IMGS.slice(1).forEach(s => {
  const m = s.match(/(\d+)\.webp$/);
  labels.push(m ? String(+m[1]) : "");
});
labels.push("完");
const TOTAL = Math.max(...labels.filter(x => /^\d+$/.test(x)).map(Number));
let endShown = false;

let cur = 0, busy = false;
function setCur(i){
  cur = i;
  const lab = labels[i];
  cnt.textContent = /^\d+$/.test(lab) ? (lab + " / " + TOTAL) : lab;
  prog.style.width = ((i + 1) / N * 100) + "%";
  ensure(cur, cur + 1, cur + 2, cur + 3, cur + 4, cur + 5);
  const atEnd = (i === N - 1);
  restartBtn.style.display = atEnd ? "" : "none";
  petals.classList.toggle("on", atEnd);
  if (atEnd && !endShown){
    endShown = true;
    setTimeout(() => pageEls[N - 1].classList.add("show"), 120);
  }
}
/* 动画代际：restart 时递增，使旧动画的回调全部作废，避免页面被误置透明 */
let gen = 0;
function onEnd(el, cb){
  const g = gen;
  let done = false;
  const h = () => { if (done) return; done = true; el.removeEventListener("transitionend", h); if (g === gen) cb(); };
  el.addEventListener("transitionend", h);
  setTimeout(h, 550);
}
function nudge(){
  wrap.classList.remove("nudge"); void wrap.offsetWidth; wrap.classList.add("nudge");
}
function markOpened(){ document.body.classList.add("opened"); }

let anim = null;   // 当前正在播放的程序翻页 {el}
function finishNow(){
  if (!anim) return;
  const el = anim.el;
  el.classList.add("no-trans");
  el.classList.remove("flipping");
  if (el.classList.contains("flipped")) el.classList.add("settled");
  anim = null; busy = false;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("no-trans")));
}
function flipFwd(){
  if (busy) finishNow();
  if (cur >= N - 1) { nudge(); return; }
  markOpened();
  gen++;
  const el = pageEls[cur];
  busy = true; anim = { el };
  el.classList.add("flipping");
  el.classList.remove("settled");
  el.classList.add("flipped");
  setCur(cur + 1);
  onEnd(el, () => { el.classList.remove("flipping"); el.classList.add("settled"); busy = false; anim = null; });
}
function flipBack(){
  if (busy) finishNow();
  if (cur <= 0) { nudge(); return; }
  gen++;
  const el = pageEls[cur - 1];
  busy = true; anim = { el };
  el.classList.remove("settled");
  el.classList.add("flipping");
  el.classList.remove("flipped");
  setCur(cur - 1);
  onEnd(el, () => { el.classList.remove("flipping"); busy = false; anim = null; });
}

/* ---- 拖拽跟手翻页（鼠标 / 触摸统一） ---- */
let drag = null;
wrap.addEventListener("pointerdown", e => {
  if (busy) finishNow();
  drag = { x0: e.clientX, y0: e.clientY, mode: null, el: null, p: 0 };
  try { wrap.setPointerCapture(e.pointerId); } catch(_) {}
});
wrap.addEventListener("pointermove", e => {
  if (!drag || drag.mode === "reject") return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.mode) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag.mode = "reject"; return; }
    if (dx < 0) {
      if (cur >= N - 1) { drag.mode = "reject"; return; }
      markOpened();
      drag.mode = "f"; drag.el = pageEls[cur];
      drag.el.classList.add("flipping", "no-trans");
      drag.el.classList.remove("settled");
    } else {
      if (cur <= 0) { drag.mode = "reject"; return; }
      drag.mode = "b"; drag.el = pageEls[cur - 1];
      drag.el.classList.remove("settled", "flipped");
      drag.el.classList.add("flipping", "no-trans");
    }
  }
  const r = wrap.getBoundingClientRect();
  const w = r.width || 1;
  if (drag.mode === "f") {
    drag.p = Math.min(Math.max(-dx / w, 0), 1);
    drag.el.style.transform = "rotateY(" + (-180 * drag.p).toFixed(2) + "deg)";
  } else if (drag.mode === "b") {
    drag.p = Math.min(Math.max(dx / w, 0), 1);
    drag.el.style.transform = "rotateY(" + (-180 * (1 - drag.p)).toFixed(2) + "deg)";
  }
});
wrap.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.mode) {                                     /* 点击翻页：左右各半区 */
    const r = wrap.getBoundingClientRect();
    const rel = (e.clientX - r.left) / r.width;
    if (rel > 0.55) flipFwd(); else if (rel < 0.45) flipBack();
    return;
  }
  if (d.mode === "reject") return;
  const el = d.el;
  el.classList.remove("no-trans");
  const go = d.p > 0.22;
  busy = true;
  el.style.transform = "";
  if (d.mode === "f") {
    if (go) {
      el.classList.add("flipped");
      setCur(cur + 1);
      onEnd(el, () => { el.classList.remove("flipping"); el.classList.add("settled"); busy = false; });
    } else {
      onEnd(el, () => { el.classList.remove("flipping"); busy = false; });
    }
  } else {
    if (go) {
      setCur(cur - 1);
      onEnd(el, () => { el.classList.remove("flipping"); busy = false; });
    } else {
      el.classList.add("flipped");
      onEnd(el, () => { el.classList.remove("flipping"); el.classList.add("settled"); busy = false; });
    }
  }
});
wrap.addEventListener("pointercancel", () => {
  if (!drag || !drag.mode || drag.mode === "reject") { drag = null; return; }
  const el = drag.el, mode = drag.mode;
  drag = null;
  el.classList.remove("no-trans");
  el.style.transform = "";
  if (mode === "b") el.classList.add("flipped");
  el.classList.remove("flipping");
  el.classList.add("settled");
});

/* ---- 按钮 / 键盘 ---- */
document.getElementById("prev").addEventListener("click", flipBack);
document.getElementById("next").addEventListener("click", flipFwd);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") flipBack();
  if (e.key === "ArrowRight") flipFwd();
});
restartBtn.addEventListener("click", () => {
  gen++;                       // 作废所有未决的动画回调（防止页面被误置为透明）
  busy = false; anim = null; drag = null;
  pageEls.forEach(el => {
    el.classList.add("no-trans");
    el.classList.remove("flipped", "settled", "flipping", "show");
    el.style.transform = "";
  });
  void book.offsetWidth;       // 强制回流，让归位立刻生效
  endShown = false;
  document.body.classList.remove("opened");
  setCur(0);
  nudge();
  setTimeout(() => pageEls.forEach(el => el.classList.remove("no-trans")), 100);
});
wrap.addEventListener("contextmenu", e => e.preventDefault());

/* ---- 自适应缩放：竖屏手机切全屏模式，桌面按比例缩放 ---- */
function fit(){
  const fs = (innerWidth / innerHeight) < 0.8 && innerWidth < 900;
  document.body.classList.toggle("fs", fs);
  if (fs){
    wrap.style.transform = "";
  } else {
    let s = Math.min((innerWidth - 28) / W, (innerHeight - 150) / H);
    if (s > 1.15) s = 1.15;
    wrap.style.transform = "scale(" + s + ")";
  }
}
addEventListener("resize", fit);

fit();
setCur(0);
</script>
</body>
